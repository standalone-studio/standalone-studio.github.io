  <title>Mengarahkan... - Standalone Studio</title>
  <script>
    // Penanganan otomatis perbedaan huruf besar/kecil (case sensitivity) di GitHub Pages
    (function() {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Jika URL meminta /paperleaf/ (huruf kecil), alihkan seketika ke /Paperleaf/
      if (pathname.indexOf('/paperleaf/') !== -1) {
        var target = pathname.replace('/paperleaf/', '/Paperleaf/');
        window.location.replace(target + search + hash);
        return;
      }

      // Jika URL persis /paperleaf atau /paperleaf/
      if (pathname.endsWith('/paperleaf') || pathname.endsWith('/paperleaf/')) {
        window.location.replace('/Paperleaf/' + search + hash);
        return;
      }
    })();
  </script>
